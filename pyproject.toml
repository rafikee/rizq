[project]
name = "rizq"
version = "0.1.0"
description = "Semi-autonomous swing trading engine."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.33",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
]

[project.scripts]
rizq = "rizq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rizq"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/rizq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
